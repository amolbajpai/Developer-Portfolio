[project]
name = "developer-portfolio"
version = "1.0.0"
description = "Django developer portfolio"
requires-python = ">=3.10.5"
dependencies = [
    "django==3.2.4",
    "pandas==2.3.3",
    "openpyxl==3.0.7",
    "pillow<10",
    "langchain>=1.3.4",
    "langchain-google-genai>=4.2.4",
    "typing-extensions>=4.15.0",
    "langgraph>=1.0",
    "google-genai>=2.0",
    "jsonpatch>=1.33",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "portfolio*"]
